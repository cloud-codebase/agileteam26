<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container" class="game-container">
    <header class="game-header">
      <h1 class="game-title">Tic-Tac-Toe</h1>
    </header>

    <div id="status-banner" class="status-banner" aria-live="polite">Player X's Turn</div>

    <div id="scoreboard" class="scoreboard">
      <div class="score-card score-card-x">
        <span class="score-label">Player X</span>
        <span id="score-x" class="score-val">0</span>
      </div>
      <div class="score-card score-card-draws">
        <span class="score-label">Draws</span>
        <span id="score-draws" class="score-val">0</span>
      </div>
      <div class="score-card score-card-o">
        <span class="score-label">Player O</span>
        <span id="score-o" class="score-val">0</span>
      </div>
    </div>

    <div id="board" class="board" role="grid" aria-label="Tic-Tac-Toe Game Board">
      <button class="cell" data-index="0" aria-label="Cell 0"></button>
      <button class="cell" data-index="1" aria-label="Cell 1"></button>
      <button class="cell" data-index="2" aria-label="Cell 2"></button>
      <button class="cell" data-index="3" aria-label="Cell 3"></button>
      <button class="cell" data-index="4" aria-label="Cell 4"></button>
      <button class="cell" data-index="5" aria-label="Cell 5"></button>
      <button class="cell" data-index="6" aria-label="Cell 6"></button>
      <button class="cell" data-index="7" aria-label="Cell 7"></button>
      <button class="cell" data-index="8" aria-label="Cell 8"></button>
    </div>

    <div class="controls">
      <button id="reset-btn" class="btn btn-primary" type="button">Play Again</button>
      <button id="reset-score-btn" class="btn btn-secondary" type="button">Reset Scores</button>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
