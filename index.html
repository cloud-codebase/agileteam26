<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <header>
      <h1>Tic-Tac-Toe</h1>
      <div id="status-banner" class="status-banner" role="status" aria-live="polite">
        Current Turn: <span id="current-player" class="player-indicator player-x">X</span>
      </div>
    </header>

    <div class="scoreboard" id="scoreboard">
      <div class="score-card player-x">
        <span class="label">Player X</span>
        <span class="score" id="score-x">0</span>
      </div>
      <div class="score-card tie">
        <span class="label">Draws</span>
        <span class="score" id="score-draws">0</span>
      </div>
      <div class="score-card player-o">
        <span class="label">Player O</span>
        <span class="score" id="score-o">0</span>
      </div>
    </div>

    <main>
      <div class="board" id="board" role="grid" aria-label="Tic-Tac-Toe Board">
        <button class="cell" data-cell-index="0" aria-label="Cell 1"></button>
        <button class="cell" data-cell-index="1" aria-label="Cell 2"></button>
        <button class="cell" data-cell-index="2" aria-label="Cell 3"></button>
        <button class="cell" data-cell-index="3" aria-label="Cell 4"></button>
        <button class="cell" data-cell-index="4" aria-label="Cell 5"></button>
        <button class="cell" data-cell-index="5" aria-label="Cell 6"></button>
        <button class="cell" data-cell-index="6" aria-label="Cell 7"></button>
        <button class="cell" data-cell-index="7" aria-label="Cell 8"></button>
        <button class="cell" data-cell-index="8" aria-label="Cell 9"></button>
      </div>
    </main>

    <div class="controls">
      <button id="restart-btn" class="btn btn-primary">Restart Game</button>
      <button id="reset-score-btn" class="btn btn-secondary">Reset Score</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
