<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive, two-player web-based Tic-Tac-Toe game.">
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <h1 class="game-title">Tic-Tac-Toe</h1>
      <div id="status" class="status-display status status-indicator" role="status" aria-live="polite" data-testid="status">Player X's turn</div>
    </header>

    <main class="game-main">
      <div id="board" class="board game-board" role="grid" aria-label="Tic-Tac-Toe board">
        <button class="cell" id="cell-0" role="gridcell" data-index="0" data-cell-index="0" aria-label="Cell 1"></button>
        <button class="cell" id="cell-1" role="gridcell" data-index="1" data-cell-index="1" aria-label="Cell 2"></button>
        <button class="cell" id="cell-2" role="gridcell" data-index="2" data-cell-index="2" aria-label="Cell 3"></button>
        <button class="cell" id="cell-3" role="gridcell" data-index="3" data-cell-index="3" aria-label="Cell 4"></button>
        <button class="cell" id="cell-4" role="gridcell" data-index="4" data-cell-index="4" aria-label="Cell 5"></button>
        <button class="cell" id="cell-5" role="gridcell" data-index="5" data-cell-index="5" aria-label="Cell 6"></button>
        <button class="cell" id="cell-6" role="gridcell" data-index="6" data-cell-index="6" aria-label="Cell 7"></button>
        <button class="cell" id="cell-7" role="gridcell" data-index="7" data-cell-index="7" aria-label="Cell 8"></button>
        <button class="cell" id="cell-8" role="gridcell" data-index="8" data-cell-index="8" aria-label="Cell 9"></button>
      </div>
    </main>

    <footer class="game-controls controls actions">
      <button id="reset-button" class="reset-button reset-btn btn-reset restart-btn" type="button">Reset Game</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
