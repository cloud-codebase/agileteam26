<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-container">
    <header class="game-header">
      <h1 class="game-title">Tic-Tac-Toe</h1>
    </header>

    <section id="scoreboard" class="scoreboard" aria-label="Game Scoreboard">
      <div class="score-card player-x">
        <span class="player-label">Player X</span>
        <span id="score-x" class="score-value">0</span>
      </div>
      <div class="score-card ties">
        <span class="player-label">Ties</span>
        <span id="score-ties" class="score-value">0</span>
      </div>
      <div class="score-card player-o">
        <span class="player-label">Player O</span>
        <span id="score-o" class="score-value">0</span>
      </div>
    </section>

    <div id="status-message" class="status-message" aria-live="polite">Player X's Turn</div>

    <section id="board" class="board" role="grid" aria-label="Tic Tac Toe Board">
      <button class="cell" data-index="0" role="gridcell" aria-label="Row 1, Column 1"></button>
      <button class="cell" data-index="1" role="gridcell" aria-label="Row 1, Column 2"></button>
      <button class="cell" data-index="2" role="gridcell" aria-label="Row 1, Column 3"></button>
      <button class="cell" data-index="3" role="gridcell" aria-label="Row 2, Column 1"></button>
      <button class="cell" data-index="4" role="gridcell" aria-label="Row 2, Column 2"></button>
      <button class="cell" data-index="5" role="gridcell" aria-label="Row 2, Column 3"></button>
      <button class="cell" data-index="6" role="gridcell" aria-label="Row 3, Column 1"></button>
      <button class="cell" data-index="7" role="gridcell" aria-label="Row 3, Column 2"></button>
      <button class="cell" data-index="8" role="gridcell" aria-label="Row 3, Column 3"></button>
    </section>

    <nav class="controls" aria-label="Game Controls">
      <button id="reset-btn" class="btn btn-secondary">New Round</button>
      <button id="reset-all-btn" class="btn btn-danger">Reset All</button>
    </nav>
  </main>

  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
